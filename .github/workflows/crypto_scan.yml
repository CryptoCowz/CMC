name: Daily Top Movers Market Scan & CMC Graphics

on:
  schedule:
    # Runs every day at 12:00 UTC (8:00 AM EDT)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual run anytime from the GitHub Actions tab

permissions:
  contents: write # Required for git push back to the repository

jobs:
  run-market-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true # Ensures binary images tracked by Git LFS are fully pulled

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai pillow pydantic

      - name: Run market scanner & image generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          python scripts/scan_and_prompt.py

      - name: Commit and push generated assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate daily 10 CMC graphics & cleanup old images [skip ci]"
            git push
          fi
