name: Scan Market and Generate CMC Prompts

on:
  schedule:
    # Runs at 00:00 UTC every 2 days
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-market-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: Run market scanner & prompt generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/scan_and_prompt.py

      - name: Commit and push generated prompts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/cmc_prompts_latest.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update CMC prompts [skip ci]"
            git push
          fi
