name: CMC lesson radar

on:
  schedule:
    # Daily 12:00 UTC. The script writes a digest only on Wednesday and
    # Friday in America/New_York. Other days it exits cleanly.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build review digest
        id: radar
        env:
          # Optional. The public CoinGecko endpoint works with no key.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          FORCE_DIGEST: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          set -o pipefail
          python scripts/scan_and_prompt.py | tee /tmp/radar.log
          if grep -qx 'DIGEST_WRITTEN=1' /tmp/radar.log; then
            echo "wrote=true" >> "$GITHUB_OUTPUT"
          else
            echo "wrote=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish digest in the job summary
        if: steps.radar.outputs.wrote == 'true'
        run: cat output/cmc_movers_latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit digest
        if: steps.radar.outputs.wrote == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/cmc_movers_latest.md
          if git diff --staged --quiet; then
            echo "Digest unchanged"
          else
            git commit -m "chore: refresh CMC review digest"
            git push
          fi
